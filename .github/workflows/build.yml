name: Build TopuClient Installer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Application
      run: dotnet publish TopuClient.csproj -c Release -r win-x64 --self-contained true

    - name: Download Inno Setup
      run: |
        Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe" -OutFile "innosetup.exe"
        Start-Process -FilePath "innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait

    - name: Compile Inno Setup Script
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Installer\setup.iss"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TopuClient-Setup
        path: Output/TopuClientSetup.exe
